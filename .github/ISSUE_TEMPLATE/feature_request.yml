name: 功能建议
description: 想要新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 你期望的做法
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: checkboxes
    id: contribute
    attributes:
      label: 参与
      options:
        - label: 我愿意参与实现 / 测试
